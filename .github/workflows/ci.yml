name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome checks
        run: npx --no-install biome ci

      - name: Run check
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run translation layout regression
        run: node e2e/layout-regression.cjs

      - name: Run production-artifact smoke tests
        run: PLAYWRIGHT_HEADLESS=1 npm run e2e:mock

      - name: Run production-artifact GitHub issue regression
        run: PLAYWRIGHT_ENV_FILE=/dev/null PLAYWRIGHT_HEADLESS=1 npm run e2e:github

      - name: Run production-artifact PDF regression
        run: PLAYWRIGHT_HEADLESS=1 npm run e2e:pdf

      - name: Run production-artifact YouTube recovery regression (fixtures)
        run: PLAYWRIGHT_ENV_FILE=/dev/null PLAYWRIGHT_HEADLESS=1 npm run e2e:youtube -- --fixture-only

      - name: Create verified Chrome ZIP
        run: npm run zip

      - name: Upload Chrome ZIP and E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vibe-translator-chrome
          if-no-files-found: warn
          path: |
            dist/chrome/*.zip
            e2e-artifacts/
